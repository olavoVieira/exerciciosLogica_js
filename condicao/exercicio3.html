<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Par ou Ímpar</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    input, button {
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <h2>Verificar se o número é Par ou Ímpar</h2>

  <label for="numero">Digite um número:</label>
  <input type="number" id="numero"><br>

  <button onclick="verificarParOuImpar()">Verificar</button>

  <h3>Resultado:</h3>
  <p id="resultado"></p>

  <script>
    function verificarParOuImpar() {
      const numero = parseInt(document.getElementById("numero").value);
      const resultado = document.getElementById("resultado");

      if (isNaN(numero)) {
        resultado.textContent = "Por favor, digite um número válido.";
        return;
      }

      if (numero % 2 === 0) {
        resultado.textContent = `O número ${numero} é PAR.`;
      } else {
        resultado.textContent = `O número ${numero} é ÍMPAR.`;
      }
    }
  </script>

</body>
</html>
