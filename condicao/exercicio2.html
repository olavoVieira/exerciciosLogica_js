<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Dados da Pessoa</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    input, select, button {
      margin: 8px 0;
      display: block;
    }
    #tempoCasadaContainer {
      display: none;
    }
  </style>
</head>
<body>

  <h2>Informações da Pessoa</h2>

  <label for="nome">Nome:</label>
  <input type="text" id="nome">

  <label for="sexo">Sexo:</label>
  <select id="sexo">
    <option value="">-- Selecione --</option>
    <option value="F">Feminino</option>
    <option value="M">Masculino</option>
  </select>

  <label for="estadoCivil">Estado Civil:</label>
  <select id="estadoCivil">
    <option value="">-- Selecione --</option>
    <option value="SOLTEIRA">Solteira(o)</option>
    <option value="CASADA">Casada(o)</option>
    <option value="DIVORCIADA">Divorciada(o)</option>
  </select>

  <div id="tempoCasadaContainer">
    <label for="tempoCasada">Tempo de casada (em anos):</label>
    <input type="number" id="tempoCasada" min="0">
  </div>

  <button onclick="verificarDados()">Verificar</button>

  <h3>Resultado:</h3>
  <p id="resultado"></p>

  <script>
    const sexoSelect = document.getElementById("sexo");
    const estadoCivilSelect = document.getElementById("estadoCivil");
    const tempoCasadaDiv = document.getElementById("tempoCasadaContainer");

    // Mostrar campo de tempo de casada apenas se necessário
    sexoSelect.addEventListener("change", exibirTempoCasada);
    estadoCivilSelect.addEventListener("change", exibirTempoCasada);

    function exibirTempoCasada() {
      const sexo = sexoSelect.value;
      const estadoCivil = estadoCivilSelect.value;
      tempoCasadaDiv.style.display = (sexo === "F" && estadoCivil === "CASADA") ? "block" : "none";
    }

    function verificarDados() {
      const nome = document.getElementById("nome").value.trim();
      const sexo = sexoSelect.value;
      const estadoCivil = estadoCivilSelect.value;
      const tempoCasada = document.getElementById("tempoCasada").value;
      const resultado = document.getElementById("resultado");

      if (!nome || !sexo || !estadoCivil) {
        resultado.textContent = "Por favor, preencha todos os campos obrigatórios.";
        return;
      }

      let mensagem = `Nome: ${nome}\nSexo: ${sexo}\nEstado Civil: ${estadoCivil}`;

      if (sexo === "F" && estadoCivil === "CASADA") {
        if (tempoCasada === "") {
          resultado.textContent = "Por favor, informe o tempo de casada.";
          return;
        }
        mensagem += `\nTempo de casada: ${tempoCasada} anos.`;
      }

      resultado.textContent = mensagem;
    }
  </script>

</body>
</html>
