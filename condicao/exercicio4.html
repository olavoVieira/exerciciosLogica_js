<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Soma ou Multiplicação</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    input, button {
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <h2>Soma se Iguais, Multiplica se Diferentes</h2>

  <label for="valorA">Digite o valor de A:</label>
  <input type="number" id="valorA"><br>

  <label for="valorB">Digite o valor de B:</label>
  <input type="number" id="valorB"><br>

  <button onclick="calcular()">Calcular</button>

  <h3>Resultado:</h3>
  <p id="resultado"></p>

  <script>
    function calcular() {
      const a = parseInt(document.getElementById("valorA").value);
      const b = parseInt(document.getElementById("valorB").value);
      const resultado = document.getElementById("resultado");

      if (isNaN(a) || isNaN(b)) {
        resultado.textContent = "Por favor, insira dois valores inteiros válidos.";
        return;
      }

      let c;

      if (a === b) {
        c = a + b;
        resultado.textContent = `${a} e ${b} são iguais. ${a} + ${b} = ${c}`;
      } else {
        c = a * b;
        resultado.textContent = `${a} e ${b} são diferentes. ${a} * ${b} = ${c}`;
      }
    }
  </script>

</body>
</html>
